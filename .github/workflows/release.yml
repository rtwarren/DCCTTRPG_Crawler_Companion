name: Release

# Pushing a version tag (for example v1.4.0) publishes a GitHub Release with the built page
# attached as Crawler_Companion_v<version>.html. The page's Check for updates button reads
# the newest Release, so the tag must match the first version heading in CHANGELOG.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches CHANGELOG.md
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          log_version="$(python3 -c 'import build; print(build.version())')"
          if [ "$tag_version" != "$log_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CHANGELOG.md's first version heading ($log_version)."
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Build the page
        run: python3 build.py "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html"

      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - > "$RUNNER_TEMP/notes.md" <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^##\s+v?" + re.escape(version) + r"\b[^\n]*\n(.*?)(?=^##\s|\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "Version " + version)
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html"
          --title "Crawler Companion $VERSION"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag
