name: Release

# Pushing a version tag (for example v1.4.0) publishes a GitHub Release with the built page
# attached as Crawler_Companion_v<version>.html, plus the guides in guides/. The page's
# Check for updates button reads the newest Release, so the tag must match the first
# version heading in CHANGELOG.md.
#
# Pushing a change to guides/ on main replaces the guides on the newest Release, so an
# updated guide doesn't need a new version.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
    paths:
      - "guides/**"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches CHANGELOG.md
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          log_version="$(python3 -c 'import build; print(build.version())')"
          if [ "$tag_version" != "$log_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CHANGELOG.md's first version heading ($log_version)."
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Build the page
        run: python3 build.py "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html"

      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - > "$RUNNER_TEMP/notes.md" <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^##\s+v?" + re.escape(version) + r"\b[^\n]*\n(.*?)(?=^##\s|\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "Version " + version)
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html" guides/*.pdf
          --repo "$GITHUB_REPOSITORY"
          --title "Crawler Companion $VERSION"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag

  guides:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the guides on the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" || {
            echo "No release yet; the guides go out with the first version tag."
            exit 0
          }
          gh release upload "$tag" guides/*.pdf --repo "$GITHUB_REPOSITORY" --clobber
          echo "Replaced the guides on $tag."
