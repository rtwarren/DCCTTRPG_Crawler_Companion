name: Release

# A version goes out in either of two ways:
# - push a version tag (for example v1.5.0), or
# - merge or push a commit to main that changes CHANGELOG.md, when its first version heading
#   has no release yet. Merging a pull request that adds a version releases it.
#
# A release attaches the built page as Crawler_Companion_v<version>.html, plus the guides in
# guides/, and publishes the page to GitHub Pages as index.html. The page's Check for updates
# button reads the newest Release, so the version always comes from CHANGELOG.md. Its Update
# this file button reads dist/Crawler_Companion_v<version>.html at the release's tag, so the
# release stops if that committed page doesn't match the build.
#
# Pushing a change to guides/ on main replaces the guides on the newest Release, so an
# updated guide doesn't need a new version. Run the workflow by hand (Actions, Release, Run
# workflow) to publish the newest version to GitHub Pages again.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
    paths:
      - "CHANGELOG.md"
      - "guides/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# a merge and a tag for the same version can arrive together; one run at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log_version="$(python3 -c 'import build; print(build.version())')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$log_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CHANGELOG.md's first version heading ($log_version)."
            exit 1
          fi
          echo "VERSION=$log_version" >> "$GITHUB_ENV"
          if gh release view "v$log_version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$log_version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the page
        if: steps.version.outputs.new == 'true'
        run: python3 build.py "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html"

      # Update this file in the page reads dist/ from the repo at the release's tag, so it has to be
      # the same page the release attaches
      - name: Check the committed page matches the build
        if: steps.version.outputs.new == 'true'
        run: |
          if ! cmp -s "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html" "dist/Crawler_Companion_v$VERSION.html"; then
            echo "::error::dist/Crawler_Companion_v$VERSION.html is missing or out of date. Run python build.py and commit dist/."
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        if: steps.version.outputs.new == 'true'
        run: |
          python3 - > "$RUNNER_TEMP/notes.md" <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^##\s+v?" + re.escape(version) + r"\b[^\n]*\n(.*?)(?=^##\s|\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "Version " + version)
          PY

      - name: Publish the release
        id: publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a pushed tag is used as it is; from main, the release makes the tag on this commit
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then where="--verify-tag"; else where="--target $GITHUB_SHA"; fi
          gh release create "v$VERSION" "$RUNNER_TEMP/Crawler_Companion_v$VERSION.html" guides/*.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crawler Companion $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $where
          echo "released=true" >> "$GITHUB_OUTPUT"

  guides:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the guides on the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" || {
            echo "No release yet; the guides go out with the first version."
            exit 0
          }
          gh release upload "$tag" guides/*.pdf --repo "$GITHUB_REPOSITORY" --clobber
          echo "Replaced the guides on $tag."

  # GitHub Pages serves the newest version at https://<owner>.github.io/<repo>/.
  # Turn it on once: repo Settings, Pages, Source: GitHub Actions.
  pages:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the page as index.html
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          python3 build.py "$RUNNER_TEMP/site/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
